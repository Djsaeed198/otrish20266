# Pre-commit configuration with Gitleaks
# See https://pre-commit.com for more information
# See https://github.com/gitleaks/gitleaks for Gitleaks documentation

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets with Gitleaks
        description: Prevent accidental commits of API keys, passwords, and tokens
        entry: gitleaks protect --verbose --redact --staged
        language: golang
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
